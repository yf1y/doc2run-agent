models:
  defaults:
    # Any LiteLLM model name can be used here.
    model: openai/gpt-5
    api_key_env: OPENAI_API_KEY
    timeout: 120
    max_retries: 3
    # Output budget passed to LiteLLM. It must be smaller than context_tokens.
    max_tokens: 4000
    # Total model context; the workflow reserves max_tokens before checking input.
    context_tokens: 16000

  requirements:
    max_tokens: 1500

  code:
    timeout: 180
    max_tokens: 5000

  fix:
    max_tokens: 3000
